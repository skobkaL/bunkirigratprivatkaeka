<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бункер — онлайн</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- ===== ЭКРАН ВХОДА ===== -->
  <section id="screen-join" class="screen">
    <div class="panel">
      <h1 class="pixel">БУНКЕР</h1>
      <p class="sub">уютная ретро-игра о выживании</p>
      <div class="field"><label>Ваше имя</label><input id="inp-name" maxlength="20" placeholder="Как вас звать?"></div>
      <div class="row">
        <button id="btn-create" class="btn btn-primary">Создать игру</button>
      </div>
      <div class="divider">или по коду</div>
      <div class="row">
        <input id="inp-code" maxlength="5" placeholder="КОД" class="code-input">
        <button id="btn-join" class="btn">Войти</button>
      </div>
      <p id="join-error" class="error"></p>
    </div>
  </section>

  <!-- ===== ЛОББИ ===== -->
  <section id="screen-lobby" class="screen hidden">
    <div class="layout">
      <div class="panel">
        <h2 class="pixel">Комната <span id="room-code"></span></h2>
        <p class="sub">Поделитесь кодом или ссылкой: <span id="room-link" class="link"></span></p>
        <ul id="player-list" class="player-list"></ul>
        <div class="row">
          <button id="btn-ready" class="btn">Я готов</button>
        </div>
        <p id="lobby-error" class="error"></p>
      </div>
      <div class="panel" id="host-panel">
        <h3 class="pixel small-title">Настройки (хост)</h3>
        <div class="settings-grid">
          <div class="field"><label>Раундов</label><input type="number" id="set-rounds" min="1" max="6" value="3"></div>
          <div class="field"><label>Выживет</label><input type="number" id="set-survivors" min="1" max="15" placeholder="½"></div>
          <div class="field"><label>Выступление, сек</label><input type="number" id="set-speech" min="15" max="300" value="75"></div>
          <div class="field"><label>Обсуждение, сек</label><input type="number" id="set-discuss" min="30" max="900" value="240"></div>
          <div class="field check"><label><input type="checkbox" id="set-anon"> Анонимное голосование</label></div>
          <div class="field wide"><label>Свой сценарий катастрофы (пусто = случайный)</label><textarea id="set-scenario" rows="3"></textarea></div>
        </div>
        <div class="row">
          <button id="btn-save-settings" class="btn">Сохранить</button>
          <button id="btn-start" class="btn btn-primary">Начать игру</button>
        </div>
        <div class="row">
          <button id="btn-deck" class="btn btn-ghost">Редактор карточек</button>
        </div>
        <div id="deck-editor" class="deck-editor hidden"></div>
      </div>
      <div class="panel chat-panel">
        <h3 class="pixel small-title">Чат</h3>
        <div id="chat-box" class="chat-box"></div>
        <div class="row"><input id="chat-input" placeholder="Сообщение…"><button id="chat-send" class="btn">➤</button></div>
      </div>
    </div>
  </section>

  <!-- ===== СЦЕНАРИЙ ===== -->
  <section id="screen-scenario" class="screen hidden">
    <div class="panel wide-center">
      <h2 class="pixel" id="scenario-title"></h2>
      <p id="scenario-text" class="scenario-text"></p>
      <div id="scenario-host" class="row hidden"><button id="btn-start-round" class="btn btn-primary">Начать раунд 1</button></div>
      <p class="sub">Обсудите катастрофу. Хост начнёт первый раунд.</p>
    </div>
  </section>

  <!-- ===== ИГРА ===== -->
  <section id="screen-game" class="screen hidden">
    <header class="game-header">
      <div class="pixel hud" id="hud-round">РАУНД 1/3</div>
      <div class="pixel hud" id="hud-alive">В БУНКЕРЕ: 6</div>
      <div class="hud timer pixel" id="hud-timer">--</div>
      <div class="hud" id="hud-phase"></div>
    </header>
    <div class="layout game-layout">
      <div class="panel players-panel">
        <h3 class="pixel small-title">Обитатели</h3>
        <div id="game-players"></div>
      </div>
      <div class="panel main-panel">
        <div id="phase-box"></div>
      </div>
      <div class="panel chat-panel">
        <h3 class="pixel small-title">Чат</h3>
        <div id="chat-box-game" class="chat-box"></div>
        <div class="row"><input id="chat-input-game" placeholder="Сообщение…"><button id="chat-send-game" class="btn">➤</button></div>
      </div>
    </div>
  </section>

  <!-- ===== ФИНАЛ ===== -->
  <section id="screen-finish" class="screen hidden">
    <div class="panel wide-center">
      <h2 class="pixel">Бункер закрыт</h2>
      <div id="finish-list"></div>
      <h3 class="pixel small-title">Хроника партии</h3>
      <div id="finish-log"></div>
      <div class="row" id="finish-host hidden"><button id="btn-lobby-again" class="btn">Вернуться в лобби</button></div>
    </div>
  </section>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
